<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boring Games</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    font-family: system-ui, -apple-system, sans-serif;
    background: #1e1e2e;
    color: #e4e4e7;
    padding: 24px;
  }
  h1 { font-size: 2.4rem; letter-spacing: 4px; }
  p.sub { color: #a6adc8; margin-top: -24px; }
  .grid { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  a.card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 240px;
    padding: 36px 20px;
    background: #313244;
    border-radius: 16px;
    text-decoration: none;
    color: #e4e4e7;
    transition: transform 0.15s, background 0.15s;
  }
  a.card:hover { transform: translateY(-6px); background: #45475a; }
  .icon { font-size: 4rem; }
  .name { font-size: 1.3rem; font-weight: 700; }
  .desc { font-size: 0.85rem; color: #a6adc8; text-align: center; line-height: 1.4; }
</style>
</head>
<body>
<h1>BORING GAMES</h1>
<p class="sub">Pick a game. No account, no ads.</p>
<div class="grid">
  <a class="card" href="chess.html">
    <div class="icon">&#9822;</div>
    <div class="name">Chess Coach</div>
    <div class="desc">Vs bot with hints and blunder detection. Learn while you play.</div>
  </a>
  <a class="card" href="tic-tac-toe.html">
    <div class="icon">&#10005;</div>
    <div class="name">Tic Tac Toe</div>
    <div class="desc">Vs bot, three difficulties. Classic quick duel.</div>
  </a>
</div>
</body>
</html>
