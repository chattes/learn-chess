<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe vs Bot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
    background: #1e1e2e;
    color: #e4e4e7;
    gap: 20px;
    padding: 20px;
  }
  h1 { font-size: 2rem; letter-spacing: 2px; }
  #status { font-size: 1.1rem; min-height: 1.5em; color: #a6e3a1; }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 110px);
    grid-template-rows: repeat(3, 110px);
    gap: 10px;
  }
  .cell {
    background: #313244;
    border: none;
    border-radius: 12px;
    font-size: 3rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, transform 0.15s;
    color: #89b4fa;
  }
  .cell:hover:not(:disabled) { background: #45475a; transform: scale(1.05); }
  .cell:disabled { cursor: default; }
  .cell.o { color: #f38ba8; }
  .cell.win { background: #a6e3a1; color: #1e1e2e; }
  #controls { display: flex; gap: 12px; align-items: center; }
  button#reset {
    padding: 10px 24px;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    background: #89b4fa;
    color: #1e1e2e;
    cursor: pointer;
    font-weight: 600;
  }
  button#reset:hover { background: #b4befe; }
  select {
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #313244;
    color: #e4e4e7;
    font-size: 1rem;
  }
  #score { font-size: 0.95rem; color: #a6adc8; }
</style>
</head>
<body>
<h1>TIC TAC TOE</h1>
<div id="controls">
  <label>Bot difficulty:
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard" selected>Hard (unbeatable)</option>
    </select>
  </label>
  <button id="reset">New Game</button>
</div>
<div id="status">Your turn (X)</div>
<div id="board"></div>
<div id="score">You: 0 &nbsp;|&nbsp; Bot: 0 &nbsp;|&nbsp; Draws: 0</div>

<script>
const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const scoreEl = document.getElementById('score');
const difficultyEl = document.getElementById('difficulty');
const resetBtn = document.getElementById('reset');

let board, gameOver, score = { you: 0, bot: 0, draws: 0 };
const HUMAN = 'X', BOT = 'O';
const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function initBoard() {
  board = Array(9).fill(null);
  gameOver = false;
  boardEl.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('button');
    cell.className = 'cell';
    cell.dataset.index = i;
    cell.addEventListener('click', onCellClick);
    boardEl.appendChild(cell);
  }
  statusEl.textContent = 'Your turn (X)';
}

function onCellClick(e) {
  const i = +e.target.dataset.index;
  if (gameOver || board[i]) return;
  makeMove(i, HUMAN);
  if (checkEnd()) return;
  statusEl.textContent = 'Bot thinking...';
  setTimeout(botMove, 400);
}

function makeMove(i, player) {
  board[i] = player;
  const cell = boardEl.children[i];
  cell.textContent = player;
  if (player === BOT) cell.classList.add('o');
  cell.disabled = true;
}

function winner(b) {
  for (const [a, c, d] of WINS) {
    if (b[a] && b[a] === b[c] && b[a] === b[d]) return { player: b[a], line: [a, c, d] };
  }
  return null;
}

function checkEnd() {
  const w = winner(board);
  if (w) {
    gameOver = true;
    w.line.forEach(i => boardEl.children[i].classList.add('win'));
    if (w.player === HUMAN) { score.you++; statusEl.textContent = 'You win!'; }
    else { score.bot++; statusEl.textContent = 'Bot wins!'; }
    updateScore();
    return true;
  }
  if (board.every(Boolean)) {
    gameOver = true;
    score.draws++;
    statusEl.textContent = "It's a draw!";
    updateScore();
    return true;
  }
  return false;
}

function updateScore() {
  scoreEl.textContent = `You: ${score.you} | Bot: ${score.bot} | Draws: ${score.draws}`;
}

function botMove() {
  const diff = difficultyEl.value;
  let move;
  if (diff === 'easy') {
    move = randomMove();
  } else if (diff === 'medium') {
    move = Math.random() < 0.6 ? bestMove() : randomMove();
  } else {
    move = bestMove();
  }
  if (move !== undefined) makeMove(move, BOT);
  if (!checkEnd()) statusEl.textContent = 'Your turn (X)';
}

function randomMove() {
  const empties = board.map((v, i) => v ? null : i).filter(v => v !== null);
  return empties[Math.floor(Math.random() * empties.length)];
}

function bestMove() {
  let best = -Infinity, move;
  for (let i = 0; i < 9; i++) {
    if (board[i]) continue;
    board[i] = BOT;
    const score = minimax(board, 0, false, -Infinity, Infinity);
    board[i] = null;
    if (score > best) { best = score; move = i; }
  }
  return move;
}

function minimax(b, depth, isMaximizing, alpha, beta) {
  const w = winner(b);
  if (w) return w.player === BOT ? 10 - depth : depth - 10;
  if (b.every(Boolean)) return 0;

  if (isMaximizing) {
    let maxEval = -Infinity;
    for (let i = 0; i < 9; i++) {
      if (b[i]) continue;
      b[i] = BOT;
      maxEval = Math.max(maxEval, minimax(b, depth + 1, false, alpha, beta));
      b[i] = null;
      alpha = Math.max(alpha, maxEval);
      if (beta <= alpha) break;
    }
    return maxEval;
  } else {
    let minEval = Infinity;
    for (let i = 0; i < 9; i++) {
      if (b[i]) continue;
      b[i] = HUMAN;
      minEval = Math.min(minEval, minimax(b, depth + 1, true, alpha, beta));
      b[i] = null;
      beta = Math.min(beta, minEval);
      if (beta <= alpha) break;
    }
    return minEval;
  }
}

resetBtn.addEventListener('click', initBoard);
difficultyEl.addEventListener('change', initBoard);
initBoard();
</script>
</body>
</html>
